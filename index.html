<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4CAF50">
<title>Календарь</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f0f0f0;
    overflow-x: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 12px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }

  .calendar {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    padding: 14px;
    width: 100%;
    max-width: 480px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }

  .header h2 {
    margin: 0;
    font-size: 18px;
    text-align: center;
    flex: 1;
    color: #222;
    white-space: nowrap;
  }

  .header button {
    background: #4CAF50;
    border: none;
    color: white;
    font-size: 22px;
    width: 44px;
    height: 44px;
    min-width: 44px;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    line-height: 1;
    touch-action: manipulation;
  }

  .header button:active {
    background: #388e3c;
    transform: scale(0.92);
  }

  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .weekdays div {
    text-align: center;
    font-weight: 600;
    color: #888;
    font-size: 12px;
    padding: 6px 0;
    user-select: none;
  }

  .days div {
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s, transform 0.1s;
    background: #f7f7f7;
    color: #222;
    touch-action: manipulation;
  }

  .days div:active:not(.empty) {
    transform: scale(0.9);
    background: #d8d8d8;
  }

  .days div.empty {
    background: transparent;
    cursor: default;
    pointer-events: none;
  }

  .days div.today {
    border: 2px solid #4CAF50;
    font-weight: 700;
    color: #2e7d32;
  }

  .days div.selected {
    background: #4CAF50;
    color: white;
    font-weight: 700;
  }

  .days div.selected:active {
    background: #388e3c;
  }

  /* Очень маленькие экраны */
  @media (max-width: 340px) {
    .days div { font-size: 13px; border-radius: 8px; }
    .weekdays div { font-size: 11px; }
    .header h2 { font-size: 16px; }
    .header button { width: 40px; height: 40px; min-width: 40px; font-size: 20px; }
  }

  /* Ландшафт на телефоне */
  @media (orientation: landscape) and (max-height: 500px) {
    body { padding: 6px; align-items: center; }
    .calendar { padding: 10px; }
    .header { margin-bottom: 6px; }
    .header h2 { font-size: 15px; }
    .header button { width: 38px; height: 38px; min-width: 38px; font-size: 18px; }
    .weekdays div { padding: 3px 0; font-size: 11px; }
    .days div { font-size: 13px; border-radius: 6px; }
    .weekdays, .days { gap: 3px; }
  }
</style>
</head>
<body>

<div class="calendar">
  <div class="header">
    <button id="prev" aria-label="Предыдущий месяц">‹</button>
    <h2 id="monthYear"></h2>
    <button id="next" aria-label="Следующий месяц">›</button>
  </div>
  <div class="weekdays">
    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
  </div>
  <div class="days" id="days"></div>
</div>

<script>
  const monthYear = document.getElementById('monthYear');
  const daysEl = document.getElementById('days');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  const monthNames = [
    'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
    'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
  ];

  const today = new Date();
  let currentYear = today.getFullYear();
  let currentMonth = today.getMonth();

  // Хранилище выбранных дней "год-месяц-день"
  const selectedDays = new Set();

  function renderCalendar() {
    daysEl.innerHTML = '';
    monthYear.textContent = `${monthNames[currentMonth]} ${currentYear}`;

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const offset = (firstDay === 0) ? 6 : firstDay - 1;
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    // Пустые ячейки
    for (let i = 0; i < offset; i++) {
      const empty = document.createElement('div');
      empty.classList.add('empty');
      daysEl.appendChild(empty);
    }

    // Дни
    for (let d = 1; d <= daysInMonth; d++) {
      const dayEl = document.createElement('div');
      dayEl.textContent = d;
      const key = `${currentYear}-${currentMonth}-${d}`;

      if (
        d === today.getDate() &&
        currentMonth === today.getMonth() &&
        currentYear === today.getFullYear()
      ) {
        dayEl.classList.add('today');
      }

      if (selectedDays.has(key)) {
        dayEl.classList.add('selected');
      }

      const toggle = () => {
        if (selectedDays.has(key)) {
          selectedDays.delete(key);
          dayEl.classList.remove('selected');
        } else {
          selectedDays.add(key);
          dayEl.classList.add('selected');
        }
      };

      // touchstart + click с защитой от двойного срабатывания
      let touched = false;
      dayEl.addEventListener('touchstart', (e) => {
        touched = true;
        toggle();
      }, { passive: true });

      dayEl.addEventListener('click', (e) => {
        if (touched) {
          touched = false;
          return;
        }
        toggle();
      });

      daysEl.appendChild(dayEl);
    }
  }

  // Свайпы для смены месяца
  let touchStartX = 0;
  let touchStartY = 0;
  const calendarEl = document.querySelector('.calendar');

  calendarEl.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  calendarEl.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;

    // Горизонтальный свайп, не мешаем вертикальному скроллу
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx > 0) {
        changeMonth(-1);
      } else {
        changeMonth(1);
      }
    }
  }, { passive: true });

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    } else if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    renderCalendar();
  }

  prevBtn.addEventListener('click', () => changeMonth(-1));
  nextBtn.addEventListener('click', () => changeMonth(1));

  renderCalendar();
</script>

</body>
</html>
